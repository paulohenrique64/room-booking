{% if messages %}
<div class="mb-6 space-y-3" id="messages">
    {% for message in messages %}
    {% if message.tags == 'success' %}
    <div class="rounded-xl border border-secondary-container bg-secondary-container/30 px-4 py-3 text-sm text-secondary-base">
        {{ message }}
    </div>
    {% elif message.tags == 'error' or message.tags == 'danger' %}
    <div class="rounded-xl border border-error-container bg-error-container/60 px-4 py-3 text-sm text-on-error-container">
        {{ message }}
    </div>
    {% else %}
    <div class="rounded-xl border border-outline-variant bg-surface-card px-4 py-3 text-sm text-on-surface">
        {{ message }}
    </div>
    {% endif %}
    {% endfor %}
</div>
{% endif %}
