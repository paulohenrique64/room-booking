<!doctype html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Portal - Room Booking</title>
    <!-- CSS and main script handled by Vite -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-surface text-on-surface flex h-screen overflow-hidden antialiased">
    
    <!-- SideNavBar -->
    <aside class="hidden md:flex flex-col h-screen w-64 fixed left-0 top-0 bg-surface-card border-r border-outline-variant shadow-sm z-50">
      <div class="flex flex-col h-full py-6 px-4">
        
        <!-- Corporate Identity Header -->
        <div class="mb-8 flex items-center gap-3 px-2">
          <div class="w-10 h-10 rounded-full bg-primary-light text-white flex items-center justify-center font-bold text-lg select-none shadow-sm">
            WP
          </div>
          <div>
            <h1 class="font-bold text-base text-primary-base tracking-tight">Workspace Portal</h1>
            <p class="text-xs text-on-surface-variant font-medium">Enterprise Resource Management</p>
          </div>
        </div>
        
        <!-- Navigation Rails (HTMX Swappers) -->
        <nav class="flex-1 space-y-1.5">
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-primary-base font-semibold bg-primary-container/10 active:scale-[0.98] transition-all cursor-pointer text-sm"
             hx-get="/api/views/dashboard"
             hx-target="#main-content"
             hx-swap="innerHTML">
            <span class="material-symbols-outlined symbol-filled">dashboard</span>
            Dashboard
          </a>
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container/30 active:scale-[0.98] transition-all cursor-pointer text-sm"
             hx-get="/api/views/bookings"
             hx-target="#main-content"
             hx-swap="innerHTML">
            <span class="material-symbols-outlined">calendar_today</span>
            Minhas Reservas
          </a>
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container/30 active:scale-[0.98] transition-all cursor-pointer text-sm"
             hx-get="/api/views/rooms"
             hx-target="#main-content"
             hx-swap="innerHTML">
            <span class="material-symbols-outlined">meeting_room</span>
            Salas
          </a>
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container/30 active:scale-[0.98] transition-all cursor-pointer text-sm"
             hx-get="/api/views/equipment"
             hx-target="#main-content"
             hx-swap="innerHTML">
            <span class="material-symbols-outlined">home_repair_service</span>
            Equipamentos
          </a>
          <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container/30 active:scale-[0.98] transition-all cursor-pointer text-sm"
             hx-get="/api/views/reports"
             hx-target="#main-content"
             hx-swap="innerHTML">
            <span class="material-symbols-outlined">bar_chart</span>
            Relatórios
          </a>
        </nav>
        
        <!-- Bottom Booking Trigger CTA -->
        <div class="mt-auto pt-6 border-t border-outline-variant">
          <button class="w-full bg-primary-base hover:bg-primary-light active:scale-[0.97] text-white text-sm font-semibold py-3 rounded-xl flex justify-center items-center gap-2 transition-all shadow-md hover:shadow-lg cursor-pointer"
                  hx-get="/api/modals/create-booking"
                  hx-target="#modal-container"
                  hx-swap="innerHTML">
            <span class="material-symbols-outlined text-[18px]">add</span>
            Nova Reserva
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area Wrapper -->
    <div class="flex-1 flex flex-col md:ml-64 w-full h-screen">
      
      <!-- TopNavBar -->
      <header class="flex justify-between items-center px-6 md:px-10 h-20 bg-surface fixed top-0 right-0 w-full md:w-[calc(100%-16rem)] z-40 border-b border-outline-variant transition-all">
        <div class="flex items-center gap-4">
          <!-- Mobile Sidebar Toggle visual -->
          <div class="md:hidden flex items-center justify-center p-2 rounded-lg bg-surface-card border border-outline-variant">
            <span class="material-symbols-outlined text-primary-base">menu</span>
          </div>
          <h2 class="font-extrabold text-lg select-none text-primary-base">Room Booking</h2>
          
          <!-- Search Bar (real-time filtering across active DOM elements via JS) -->
          <div class="relative ml-4 md:ml-8 group select-none hidden sm:block">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-border group-focus-within:text-primary-base transition-colors">search</span>
            <input class="pl-10 pr-4 py-2 bg-surface-card border border-outline-variant rounded-xl focus:outline-none focus:border-primary-base focus:ring-1 focus:ring-primary-base w-48 lg:w-64 text-sm text-on-surface transition-all placeholder:text-on-surface-variant/50" 
                   placeholder="Search rooms..." 
                   type="text" />
          </div>
        </div>
        
        <!-- Left indicators and user avatar -->
        <div class="flex items-center gap-4">
          <button class="p-2 text-on-surface-variant hover:bg-outline-variant/30 rounded-xl transition-all relative">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-error-base rounded-full"></span>
          </button>
          
          <div class="h-10 border-r border-outline-variant"></div>
          
          <div class="flex items-center gap-2 cursor-pointer group">
            <div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline-variant ring-0 group-hover:ring-2 ring-primary-light transition-all">
              <img alt="User profile image" 
                   referrerpolicy="no-referrer"
                   class="w-full h-full object-cover" 
                   src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQEbIles-DoIHukVFI53NDuxDUkvTckYdImluhVysXsuUgic6udBvVzYLZ4Uf1NRSTmZJLgGDWJVuP701DXe4qksEwOqhPRuBdst10asyQw4ur78vaabgc5xbSBM-lB-zgrZgyuKxU08t1xi1Gf7rv9GJ5zUwJu4JQ_FA2jAil0dJGD9lMiCbGXVjbqv4S0PkYqA-xZDGnD5bH370h_1yWPSvYWE3LiK0IxmpC7yYYLjB0QVneQtBlutT8Zyocqhp4PLI3xYgfgGp3" />
            </div>
            <div class="hidden lg:block text-left select-none leading-tight">
              <p class="text-xs font-semibold text-on-surface leading-none">Paulo Silveira</p>
              <p class="text-[10px] text-on-surface-variant mt-0.5">Administrador</p>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic Canvas Panel -->
      <main id="main-content" 
            class="flex-1 overflow-y-auto mt-20 p-6 md:p-10 bg-background"
            hx-get="/api/views/dashboard"
            hx-trigger="load"
            hx-swap="innerHTML">
        <!-- Inside here, dynamic views (Dashboard, Rooms, Bookings, etc.) are rendered by HTMX -->
        <div class="flex items-center justify-center h-full">
          <div class="flex flex-col items-center gap-3">
            <div class="w-12 h-12 rounded-full border-4 border-primary-light border-t-transparent animate-spin"></div>
            <p class="text-sm font-medium text-on-surface-variant">Carregando portal...</p>
          </div>
        </div>
      </main>
      
    </div>

    <!-- Target container for dialogs / modals -->
    <div id="modal-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
