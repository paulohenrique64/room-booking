<form method="post" action="{% url 'accounts:login' %}">
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="rounded-xl border border-error-container bg-error-container/60 px-4 py-3 text-sm text-on-error-container">
        {{ form.non_field_errors }}
    </div>
    {% endif %}
    <div class="mb-4">
        <label class="mb-2 block text-sm font-semibold text-on-surface" for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" class="input-field" required autofocus>
    </div>
    <div class="mb-6">
        <label class="mb-2 block text-sm font-semibold text-on-surface" for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" class="input-field" required>
    </div>
    <button type="submit" class="w-full rounded-xl bg-primary-base px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-light">Entrar</button>
</form>
